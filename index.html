<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veriprod</title>
<meta name="description" content="Check if a product is genuine before you pay.">
<meta name="theme-color" content="#272a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <div class="ad" role="complementary" aria-label="Sponsored">
    <span class="tag">Ad</span><span class="msg" id="adMsg"></span>
  </div>
  <header class="top">
    <div class="logo" aria-label="Veriprod">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--brand)"/><path d="M9 16.5l4.5 4.5L23 11.5" stroke="var(--brand-ink)" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Veriprod
    </div>
    <span class="spacer"></span>
    <span class="chip" id="planChip"></span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Main">
  <div class="in" id="tabs"></div>
</nav>
<input type="file" id="qrFileCam" class="vh" accept="image/*" capture="environment" aria-label="Take a photo of the QR code" tabindex="-1">
<input type="file" id="qrFilePick" class="vh" accept="image/*" aria-label="Choose a photo of the QR code" tabindex="-1">


<script src="vendor/jsqr/jsQR.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
